[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-creator"
version = "0.1.0"
description = "CLI tool to set up Red Hat consulting proposal folders in Google Drive"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
project-creator = "project_creator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["project_creator"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["project_creator"]
omit = ["project_creator/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70
